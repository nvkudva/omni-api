[gateway]
host = "127.0.0.1"
port = 10000
idle_unload_minutes = 10

[chat]
model = "qwen2.5:0.5b"

[decide]
# Vega 0.8B (a frozen Qwen3.5 plus a physics engine), 8-bit ONNX: about 930 MB.
model = "nvkudva/vega-onnx-q8"

[embed]
model = "embeddinggemma-2"

[stt]
# Parakeet TDT 0.6B v2 (English) as int8 ONNX, run by onnx-asr: about 660 MB, no MLX or torch.
model = "istupakov/parakeet-tdt-0.6b-v2-onnx"

[tts]
# Kokoro-82M, int8 ONNX: 92 MB plus about 30 MB of voices.
model = "onnx-community/Kokoro-82M-v1.0-ONNX"
voice = "af_heart"

[image]
# Turbo: the 7B pipeline distilled to 8 steps, as a Q8_0 GGUF transformer: 7.6 GB instead of
# 14.2 GB. The text encoder and VAE still come from the base checkpoint, so a first generation
# is about 26 GB, not 7.6 GB. The worker finds the GGUF file and the base checkpoint (text
# encoder, VAE and the `sample_sigmas` schedule in model_index.json) from the repo itself;
# `file` and `base` pin them by hand instead.
model = "unsloth/Qwen-Image-2.1-Turbo-GGUF"
steps = 8

[video]
# Wan 2.2 TI2V-5B (text and image to video) as a Q8_0 GGUF transformer: 5.4 GB. The text encoder
# and VAE come from `base`, the diffusers conversion of the original, so a first generation
# downloads about 20 GB. `file` pins a GGUF by hand; `steps` overrides the family default.
model = "QuantStack/Wan2.2-TI2V-5B-GGUF"
base = "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
fps = 24
