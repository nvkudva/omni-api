[gateway]
host = "127.0.0.1"
port = 10000
idle_unload_minutes = 10

[chat]
model = "qwen2.5:3b"

[decide]
model = "hf.co/mradermacher/OneJev1.5-0.8B-GGUF:Q8_0"

[embed]
model = "embeddinggemma-2"

[stt]
# parakeet-mlx builds a dense model from config.json and loads it strictly, so a
# 4-bit pack cannot work: animaslabs/parakeet-tdt-0.6b-v3-mlx-4bit fails with
# "442 parameters not in model" (its .scales/.biases have nowhere to go).
model = "mlx-community/parakeet-tdt-0.6b-v3"

[tts]
model = "prince-canuma/Kokoro-82M-4bit"
voice = "af_heart"

[image]
# Turbo: same 7B pipeline distilled to 8 steps. It ships its own sampling
# schedule in model_index.json (`sample_sigmas`), which the pinned diffusers
# does not read yet, so the worker passes it explicitly (workers/image.py).
model = "Qwen/Qwen-Image-2.1-Turbo"
steps = 8

[video]
# 4-bit MLX: the same 28-file LTX-2.5 pack as q8, ~51 GB instead of ~75 GB.
model = "dgrauet/ltx-2.5-mlx-q4"
frames = 97
fps = 24
