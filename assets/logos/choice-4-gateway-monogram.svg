<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10"/>
      <stop offset="50%" stop-color="#0f131d"/>
      <stop offset="100%" stop-color="#161c2b"/>
    </linearGradient>

    <linearGradient id="border-glow-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Quadrant 1: Top Arc (Chat / Language) -->
    <linearGradient id="arc-chat" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Quadrant 2: Right Arc (Audio / TTS / STT) -->
    <linearGradient id="arc-audio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Quadrant 3: Bottom Arc (Embed / Decide) -->
    <linearGradient id="arc-reason" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Quadrant 4: Left Arc (Vision / Image / Video) -->
    <linearGradient id="arc-vision" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow-4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="bloom-4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bg-grad-4)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#border-glow-4)" stroke-width="2"/>

  <!-- Subtly etched circuit coordinates -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1.5">
    <circle cx="256" cy="256" r="185" fill="none" stroke-dasharray="4 8"/>
    <line x1="71" y1="256" x2="105" y2="256"/>
    <line x1="407" y1="256" x2="441" y2="256"/>
    <line x1="256" y1="71" x2="256" y2="105"/>
    <line x1="256" y1="407" x2="256" y2="441"/>
  </g>

  <!-- Segmented O Ring (Outer R=140, Inner r=104, thickness=36) with 14 deg gaps -->
  <!-- Center is 256, 256.
       Angles with 14-deg gaps:
       Top Arc: -130 deg to -50 deg (span 80 deg)
       Right Arc: -40 deg to 40 deg (span 80 deg)
       Bottom Arc: 50 deg to 130 deg (span 80 deg)
       Left Arc: 140 deg to 220 deg (span 80 deg)
  -->
  <g filter="url(#shadow-4)">
    <!-- Top Arc: Chat / Language -->
    <!-- R=122 stroke-width=34 from angle 228° to 312° -->
    <path d="M 174,165 A 122 122 0 0 1 338,165" 
          fill="none" stroke="url(#arc-chat)" stroke-width="34" stroke-linecap="round"/>

    <!-- Right Arc: Audio / Speech -->
    <!-- from angle 318° to 42° -->
    <path d="M 347,174 A 122 122 0 0 1 347,338" 
          fill="none" stroke="url(#arc-audio)" stroke-width="34" stroke-linecap="round"/>

    <!-- Bottom Arc: Embeddings / Reasoning -->
    <!-- from angle 48° to 132° -->
    <path d="M 338,347 A 122 122 0 0 1 174,347" 
          fill="none" stroke="url(#arc-reason)" stroke-width="34" stroke-linecap="round"/>

    <!-- Left Arc: Vision / Image / Video -->
    <!-- from angle 138° to 222° -->
    <path d="M 165,338 A 122 122 0 0 1 165,174" 
          fill="none" stroke="url(#arc-vision)" stroke-width="34" stroke-linecap="round"/>
  </g>

  <!-- Central Counter: Port Gateway & CLI Glyph -->
  <!-- Inner circular dark well -->
  <circle cx="256" cy="256" r="76" fill="#0b0e17" stroke="#1e293b" stroke-width="2"/>

  <!-- Sleek Developer CLI Chevron: > and Port Singularity Dot -->
  <g filter="url(#bloom-4)">
    <!-- Chevron '>' -->
    <path d="M 232,230 L 258,256 L 232,282" 
          fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Gateway Port Dot / Singularity -->
    <circle cx="282" cy="256" r="6" fill="#34d399"/>
    <circle cx="282" cy="256" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Modern Mono Port Badge -->
  <text x="256" y="460" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3" fill="#64748b">PORT : 10000</text>
</svg>
