[project]
name = "omni-api"
version = "0.1.0"
description = "One local gateway for chat, decide, embeddings, speech-to-text and text-to-speech"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "torch==2.14.1",
  "transformers==5.19.0",
  "pillow>=10",
  "parakeet-mlx>=0.2",
  "mlx-audio>=0.2",
  "misaki[en]>=0.7",
  "torchvision>=0.29.1",
  "diffusers",
  "en-core-web-sm",
  "psutil>=7.2.2",
  "ltx-core-mlx",
  "ltx-pipelines-mlx",
]

[project.scripts]
omni = "omni.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni"]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers", rev = "4295ee3ec58efa6577bc459e9b84ca3f63aa9a96" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
ltx-core-mlx = { git = "https://github.com/dgrauet/ltx-2-mlx", subdirectory = "packages/ltx-core-mlx" }
ltx-pipelines-mlx = { git = "https://github.com/dgrauet/ltx-2-mlx", subdirectory = "packages/ltx-pipelines-mlx" }
