[project]
name = "omni-api"
version = "0.8.3"
description = "One local gateway for chat, decide, embeddings, speech-to-text and text-to-speech"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "psutil>=7.2.2",
  "huggingface_hub>=0.30",
]

[project.optional-dependencies]
# The speech, image and video workers. omni without it serves chat, decide and embed through Ollama.
media = [
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pillow>=10",
  "torch==2.14.1",
  "transformers==5.19.0",
  "onnx-asr>=0.11",
  "onnxruntime>=1.20",
  "misaki[en]>=0.7",
  "torchvision>=0.29.1",
  "diffusers",
  "accelerate>=0.26",
  "en-core-web-sm",
  "gguf>=0.10",
  "ltx-core-mlx",
  "ltx-pipelines-mlx",
]
# Tab completion for `omni <TAB>`; needs `activate-global-python-argcomplete` in the shell once.
completion = ["argcomplete>=3"]

[project.scripts]
omni = "omni.cli:main"

# What the tests import: the media workers load their own packages from the extra above, which
# a Linux CI box does not install.
[dependency-groups]
dev = ["python-multipart>=0.0.9", "numpy>=1.26", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni"]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers", rev = "4295ee3ec58efa6577bc459e9b84ca3f63aa9a96" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
ltx-core-mlx = { git = "https://github.com/dgrauet/ltx-2-mlx", rev = "9e4a1a54194460547a103334b5e06382724fbba6", subdirectory = "packages/ltx-core-mlx" }
ltx-pipelines-mlx = { git = "https://github.com/dgrauet/ltx-2-mlx", rev = "9e4a1a54194460547a103334b5e06382724fbba6", subdirectory = "packages/ltx-pipelines-mlx" }
