[gateway]
host = "127.0.0.1"
port = 10000
idle_unload_minutes = 10

[chat]
model = "qwen2.5:0.5b"

[decide]
model = "hf.co/mradermacher/OneJev1.5-0.8B-GGUF:Q8_0"

[embed]
model = "embeddinggemma-2:270m"

[stt]
# parakeet-mlx builds a dense model from the repo's NeMo config.json and loads it
# strictly, so packed weights cannot work: a 4-bit pack fails with "442 parameters
# not in model", and moondream/parakeet-redux has no NeMo `target` at all
# ("Model is not supported yet!").
model = "mlx-community/parakeet-tdt-0.6b-v3"

[tts]
model = "mlx-community/Kokoro-82M-8bit"
voice = "af_heart"

[image]
# Turbo: the 7B pipeline distilled to 8 steps, as a Q8_0 GGUF transformer: 7.6 GB instead of
# 32.5 GB. The worker finds the GGUF file and the base checkpoint (text encoder, VAE and the
# `sample_sigmas` schedule in model_index.json) from the repo itself; `file` and `base` pin
# them by hand instead.
model = "unsloth/Qwen-Image-2.1-Turbo-GGUF"
steps = 8

[video]
# RAM-quantized MLX, 22B: fits the 34 GB cap. Layers carry 2-8 bits each, so the worker
# quantizes per layer (see workers/video.py). Public repo, no terms to accept.
model = "baa-ai/LTX-2.3-22B-RAM-12GB-MLX"
frames = 97
fps = 24
