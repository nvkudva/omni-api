<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>OMNI API · Playground</title>
  <link rel="icon" href="/static/app/favicon.svg" type="image/svg+xml">
  <script>
    // Paint the stored theme on the first frame (shadcn/next-themes behaviour)
    // so a dark-mode reload never flashes the light palette.
    try {
      var saved = JSON.parse(localStorage.getItem("omni.theme") || '"system"');
      var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (error) { /* storage blocked: useTheme resolves it after mount */ }
  </script>
  <script type="module" crossorigin src="/static/app/assets/index-ODnRMgQe.js"></script>

</body>
