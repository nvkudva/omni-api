[gateway]
host = "127.0.0.1"
port = 10000
idle_unload_minutes = 10

[chat]
model = "qwen2.5:3b"

[decide]
model = "hf.co/mradermacher/OneJev1.5-0.8B-GGUF:Q8_0"

[embed]
model = "embeddinggemma-2"

[stt]
# 4-bit MLX (group 64): the multilingual v3 encoder, quantized, ~0.6 GB instead of ~2.5 GB.
model = "animaslabs/parakeet-tdt-0.6b-v3-mlx-4bit"

[tts]
model = "prince-canuma/Kokoro-82M-4bit"
voice = "af_heart"

[image]
model = "Qwen/Qwen-Image-2.1"
steps = 40

[video]
# 4-bit MLX: the same 28-file LTX-2.5 pack as q8, ~51 GB instead of ~75 GB.
model = "dgrauet/ltx-2.5-mlx-q4"
frames = 97
fps = 24
